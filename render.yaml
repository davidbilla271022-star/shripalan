services:
  - type: web
    name: shripalan-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shripalan-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: shripalan-db
    plan: free
    databaseName: todo_db
    user: postgres
